name: polycodegraph
version: 0.4.0
description: Semantic, incremental code intelligence graph and stdio MCP server for Dart/Flutter, TypeScript/JavaScript, Java, Go, Python, Rust, Swift, Objective-C and Kotlin.
repository: https://github.com/RolandDumit/polycodegraph
issue_tracker: https://github.com/RolandDumit/polycodegraph/issues
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  analyzer: 13.3.0
  args: ^2.7.0
  crypto: ^3.0.7
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3
dev_dependencies:
  cli_util: ^0.6.0
  lints: ^6.0.0
  test: ^1.30.0
executables:
  polycodegraph: polycodegraph
