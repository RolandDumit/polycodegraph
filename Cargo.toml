[workspace]
members = ["crates/core", "crates/cli", "xtask"]
resolver = "3"
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
