name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo xtask check
      - run: python -m unittest discover -s tool -p "test_*.py"
      - run: cargo build --locked
      - run: python tool/profile_smoke.py --binary target/debug/polycodegraph
        if: runner.os != 'Windows'
      - run: python tool/profile_smoke.py --binary target/debug/polycodegraph.exe
        if: runner.os == 'Windows'
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: [dart, polyglot]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: providers/go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo build --release --locked --workspace
      - run: ./target/release/polycodegraph setup --languages dart,typescript,javascript,java,go,python,rust --dev
      - run: python tool/baseline.py
      - run: python tool/smoke.py --group ${{ matrix.group }} --baseline work/baseline/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/smoke.py --group ${{ matrix.group }} --baseline work/baseline/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
      - run: dart analyze
        working-directory: providers/dart
        if: matrix.group == 'dart'
      - run: dart test
        working-directory: providers/dart
        if: matrix.group == 'dart'
      - name: Fetch frozen 0.6 tag for native compatibility
        run: git fetch origin tag v0.6.0
        if: matrix.group == 'polyglot'
      - run: python tool/intent_baseline.py
        if: matrix.group == 'polyglot'
      - run: python tool/intent_smoke.py --group polyglot --binary target/release/polycodegraph --baseline work/intent-baseline-target/release/polycodegraph --config work/sdk-config.json
        if: matrix.group == 'polyglot' && runner.os != 'Windows'
      - run: python tool/intent_smoke.py --group polyglot --binary target/release/polycodegraph.exe --baseline work/intent-baseline-target/release/polycodegraph.exe --config work/sdk-config.json
        if: matrix.group == 'polyglot' && runner.os == 'Windows'
      - run: node providers/typescript/intent-context.test.cjs
        if: matrix.group == 'polyglot'
      - run: go vet ./...
        working-directory: providers/go
        if: matrix.group == 'polyglot'
      - run: python tool/intent_smoke.py --group ${{ matrix.group }} --binary target/release/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/intent_smoke.py --group ${{ matrix.group }} --binary target/release/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
      - run: python tool/no_dart_smoke.py --binary target/release/polycodegraph
        if: matrix.group == 'polyglot' && runner.os != 'Windows'
      - run: python tool/no_dart_smoke.py --binary target/release/polycodegraph.exe
        if: matrix.group == 'polyglot' && runner.os == 'Windows'
      - run: .venv/bin/python -m ruff check .
        working-directory: providers/semantic
        if: matrix.group == 'polyglot' && runner.os != 'Windows'
      - run: .venv/bin/python -m mypy .
        working-directory: providers/semantic
        if: matrix.group == 'polyglot' && runner.os != 'Windows'
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo build --release --locked --workspace
      - run: ./target/release/polycodegraph setup --languages dart
      - run: flutter pub get
        working-directory: examples/flutter_fixture
      - run: python tool/baseline.py
      - run: python tool/smoke.py --group flutter --baseline work/baseline/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/smoke.py --group flutter --baseline work/baseline/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
      - run: python tool/intent_smoke.py --group flutter --binary target/release/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/intent_smoke.py --group flutter --binary target/release/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
  mobile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        if: runner.os != 'macOS'
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          cache: true
      - name: Select extracted Swift toolchain on Linux
        if: runner.os == 'Linux'
        run: echo "$HOME/swift-6.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - run: cargo build --release --locked --workspace
      - run: ./target/release/polycodegraph setup --languages swift,objectivec,kotlin --dev
      - run: python tool/baseline.py
      - run: python tool/smoke.py --group mobile --baseline work/baseline/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/smoke.py --group mobile --baseline work/baseline/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
      - run: python tool/intent_smoke.py --group mobile --binary target/release/polycodegraph --config work/sdk-config.json
        if: runner.os != 'Windows'
      - run: python tool/intent_smoke.py --group mobile --binary target/release/polycodegraph.exe --config work/sdk-config.json
        if: runner.os == 'Windows'
      - run: python tool/sdk_smoke.py --binary target/release/polycodegraph --android
        if: runner.os != 'Windows'
      - run: python tool/sdk_smoke.py --binary target/release/polycodegraph.exe --android
        if: runner.os == 'Windows'
      - run: python tool/sdk_smoke.py --binary target/release/polycodegraph --ios
        if: runner.os == 'macOS'
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tool/baseline.py
      - run: cargo build --release --locked -p polycodegraph-core --example benchmark
      - run: python tool/benchmark.py --rust target/release/examples/benchmark --dart work/baseline/benchmark_dart --output work/benchmark.json
      - uses: actions/upload-artifact@v6
        with:
          name: query-benchmark
          path: work/benchmark.json
  packages:
    uses: ./.github/workflows/package.yml
