name: CI
on: [push, pull_request]
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - run: dart pub get --enforce-lockfile
      - run: bash tool/check.sh --build
  polyglot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: providers/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dart pub get --enforce-lockfile
      - run: bash tool/setup-providers.sh
      - run: go vet ./...
        working-directory: providers/go
      - run: bash tool/check.sh --providers
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: flutter pub get
        working-directory: examples/flutter_fixture
      - run: bash tool/check.sh --flutter
