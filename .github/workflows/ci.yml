name: CI
on: [push, pull_request]
jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/check.dart --build
  polyglot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: providers/go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: dart pub get --enforce-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: dart run tool/setup_providers.dart --typescript --java --go --python --rust --dev
      - run: go vet ./...
        working-directory: providers/go
      - run: dart run tool/check.dart --providers --build
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: flutter pub get
        working-directory: examples/flutter_fixture
      - run: dart run tool/check.dart --flutter

  mobile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        if: runner.os != 'macOS'
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/setup_providers.dart --swift --objectivec --kotlin --dev
      - run: dart run tool/check.dart --mobile --android --build
        if: runner.os != 'macOS'
      - run: dart run tool/check.dart --mobile --android --ios --build
        if: runner.os == 'macOS'
