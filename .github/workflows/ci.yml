name: CI
on: [push, pull_request]
jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/check.dart --build
  polyglot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: providers/go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/setup_providers.dart
      - run: go vet ./...
        working-directory: providers/go
      - run: dart run tool/check.dart --providers
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: flutter pub get
        working-directory: examples/flutter_fixture
      - run: dart run tool/check.dart --flutter
